name: Sync Upstream OpenClaw
on:
  schedule:
    # UTC 18:00 → 北京时间 次日02:00
    - cron: '0 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync upstream official openclaw
        run: |
          if ! git remote | grep -q upstream; then
            git remote add upstream https://github.com/openclaw/openclaw.git
          fi
          git fetch upstream
          git checkout main
          git merge --no-ff upstream/main -m "auto: sync upstream openclaw daily"
          git push origin main
