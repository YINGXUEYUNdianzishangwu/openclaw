name: Sync Upstream
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync upstream repository
        run: |
          if ! git remote | grep -q upstream; then
            git remote add upstream https://github.com/openclaw/openclaw.git
          fi
          git fetch upstream
          git checkout main
          git merge --no-ff upstream/main -m "auto: sync upstream openclaw daily"
          git push origin main
