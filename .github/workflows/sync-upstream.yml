# 2026-10-13 Auto sync upstream main branch
name: 每日同步上游OpenClaw
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码，使用SYNC_PAT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}
      - name: 添加上游远程仓库
        run: |
          git remote get-url upstream >/dev/null 2>&1 || git remote add upstream https://github.com/OpenClaw/OpenClaw.git
      - name: 拉取上游全部分支
        run: git fetch upstream
      - name: 合并上游main到本地main
        run: git merge upstream/main
      - name: 推送合并后的代码到本仓库
        run: git push origin main
